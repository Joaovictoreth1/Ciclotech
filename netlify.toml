[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; frame-src https://www.google.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
